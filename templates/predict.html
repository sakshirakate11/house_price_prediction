<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">House Price Prediction</h2>

    <form action="/predict" method="POST" class="space-y-4">
      <input type="number" name="area" placeholder="Area (sq.ft)" required
             class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="number" name="bedrooms" placeholder="Bedrooms" required
             class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="number" name="bathrooms" placeholder="Bathrooms" required
             class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      <input type="number" name="parking" placeholder="Parking" required
             class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
      
      <button type="submit"
              class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-300">
        Predict Price
      </button>
    </form>

    {% if result %}
      <h3 class="text-center text-xl font-semibold text-green-600 mt-6">{{ result }}</h3>
    {% endif %}

    <div class="text-center mt-4">
      <a href="/" class="text-blue-500 hover:underline">Back to Home</a>
    </div>
  </div>

</body>
</html>
